   <g id="text_1">
    <text style="fill: #173443; font: 700 12px 'DejaVu Sans'; text-anchor: middle" x="117.405" y="93.902554" transform="rotate(-0, 117.405, 93.902554)">Workload</text>
   </g>
   <g id="text_2">
    <text style="fill: #173443; font: 10.5px 'DejaVu Sans'" transform="translate(49.159922 110.312476)">16 requests · 8 requests/s</text>
    <text style="fill: #173443; font: 10.5px 'DejaVu Sans'" transform="translate(37.450781 122.070179)">2,048 input · 64 output tokens</text>
   </g>
   <g id="text_3">
    <text style="fill: #173443; font: 700 12px 'DejaVu Sans'; text-anchor: middle" x="337.815" y="93.902554" transform="rotate(-0, 337.815, 93.902554)">GPU service estimates</text>
   </g>
   <g id="text_4">
    <text style="fill: #173443; font: 10.5px 'DejaVu Sans'" transform="translate(259.53832 110.312476)">Model geometry + GPU specs</text>
    <text style="fill: #173443; font: 10.5px 'DejaVu Sans'" transform="translate(263.988516 122.070179)">+ functions fitted to profiles</text>
   </g>
   <g id="text_5">
    <text style="fill: #173443; font: 700 12px 'DejaVu Sans'; text-anchor: middle" x="558.225" y="93.855679" transform="rotate(-0, 558.225, 93.855679)">Serving and network settings</text>
   </g>
   <g id="text_6">
    <text style="fill: #173443; font: 10.5px 'DejaVu Sans'" transform="translate(483.214805 110.312476)">Batch cap 4 · separate pools</text>
    <text style="fill: #173443; font: 10.5px 'DejaVu Sans'" transform="translate(466.970156 122.070179)">KV handoff + bandwidth + latency</text>
   </g>
   <g id="text_7">
    <text style="fill: #173443; font: 700 12px 'DejaVu Sans'; text-anchor: middle" x="342" y="206.565199" transform="rotate(-0, 342, 206.565199)">SimPy schedules work on shared resources</text>
   </g>
   <g id="text_8">
    <text style="fill: #173443; font: 10.5px 'DejaVu Sans'" transform="translate(207.581953 225.184156)">Work readiness + resource availability → start time</text>
    <text style="fill: #173443; font: 10.5px 'DejaVu Sans'" transform="translate(205.3425 236.941859)">Start time + modeled service duration → finish time</text>
   </g>
   <g id="text_9">
    <text style="fill: #173443; font: 700 12px 'DejaVu Sans'; text-anchor: middle" x="342" y="315.615679" transform="rotate(-0, 342, 315.615679)">Each request gets a timestamped path</text>
   </g>
   <g id="text_10">
    <text style="fill: #173443; font: 10.5px 'DejaVu Sans'; text-anchor: middle" x="342" y="337.951328" transform="rotate(-0, 342, 337.951328)">Arrival → batch ready → prefill → KV handoff → decode → completion</text>
   </g>
   <g id="text_11">
    <text style="fill: #173443; font: 700 12px 'DejaVu Sans'; text-anchor: middle" x="166.23" y="426.542554" transform="rotate(-0, 166.23, 426.542554)">Choose the latest completion</text>
   </g>
   <g id="text_12">
    <text style="fill: #173443; font: 10.5px 'DejaVu Sans'" transform="translate(94.099102 442.952476)">max(2,580.707; 4,663.791;</text>
    <text style="fill: #173443; font: 10.5px 'DejaVu Sans'" transform="translate(97.788867 454.710179)">5,294.054; 5,486.647) ms</text>
   </g>
   <g id="text_13">
    <text style="fill: #173443; font: 700 12px 'DejaVu Sans'; text-anchor: middle" x="509.4" y="426.542554" transform="rotate(-0, 509.4, 426.542554)">Count completed output tokens</text>
   </g>
   <g id="text_14">
    <text style="fill: #173443; font: 10.5px 'DejaVu Sans'" transform="translate(446.454961 442.952476)">16 × 64 = 1,024 tokens</text>
    <text style="fill: #173443; font: 10.5px 'DejaVu Sans'" transform="translate(375.667734 454.710179)">Prefill produces token 1; decode produces 63 more</text>
   </g>
   <g id="text_15">
    <text style="fill: #173443; font: 700 12px 'DejaVu Sans'; text-anchor: middle" x="342" y="537.375679" transform="rotate(-0, 342, 537.375679)">Generation throughput</text>
   </g>
   <g id="text_16">
    <text style="fill: #173443; font: 10.5px 'DejaVu Sans'; text-anchor: middle" x="342" y="559.711328" transform="rotate(-0, 342, 559.711328)">1,024 tokens ÷ 5.486646698 seconds = 186.634944 tokens/s</text>
   </g>
   <g id="text_17">
    <text style="fill: #173443; font: 17px 'DejaVu Sans'; text-anchor: start" x="7.2" y="20.117344" transform="rotate(-0, 7.2, 20.117344)">How inputs become the reported throughput</text>
   </g>
  </g>
